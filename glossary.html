<!DOCTYPE html><html lang="en"><head>
<title>Glossary — AeroAdi Labs</title>
<meta name="description" content="Aviation terms in plain English — from aileron to yoke, with pronunciations.">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'><path d='M2 20 L14 20 L21 13' fill='none' stroke='%233E8BFF' stroke-width='2.4' stroke-linecap='round'/><path d='M21 13 L24 10 L23.2 14.2 Z' fill='%233E8BFF'/></svg>">
</head><body>
<div id="shell-nav"></div>
<main id="main">
<section class="page-hero"><div class="wrap">
  <span class="eyebrow">Reference</span>
  <h1 class="display-l" style="margin-top:10px">Glossary</h1>
  <p class="muted" style="max-width:560px;margin-top:10px">Plain-English definitions. No jargon explained with more jargon.</p>
  <input class="input" id="gq" placeholder="Filter terms… e.g. stall, ICAO, winglet" style="max-width:420px;margin-top:20px" aria-label="Filter glossary terms">
</div></section>
<section class="section"><div class="wrap" style="max-width:820px" id="gl"></div></section>
</main>
<div id="shell-footer"></div>
<script src="assets/data.js"></script><script src="assets/app.js"></script>
<script>
renderShell("glossary.html");
function draw(q){
  q=(q||"").toLowerCase();
  const list=GLOSSARY.filter(g=>!q||g.t.toLowerCase().includes(q)||g.d.toLowerCase().includes(q));
  let html="",last="";
  list.forEach(g=>{
    const L=g.t[0].toUpperCase();
    if(L!==last){ html+=`<div class="era-chip" style="position:static">${L}</div>`; last=L; }
    html+=`<div class="card" id="${encodeURIComponent(g.t)}" style="margin-bottom:12px">
      <div class="title-s">${g.t} ${g.say&&g.say!=="—"? `<span class="data-s" style="font-weight:400"> · ${g.say}</span>`:""}</div>
      <p class="body-s" style="margin-top:6px">${g.d}</p></div>`;
  });
  document.getElementById("gl").innerHTML = html || '<div class="empty">No terms match. Try a shorter word.</div>';
  if(location.hash){ const el=document.getElementById(decodeURIComponent(location.hash.slice(1))); if(el){el.scrollIntoView();el.style.borderColor="var(--accent)";} }
}
document.getElementById("gq").addEventListener("input",e=>draw(e.target.value));
draw("");
</script></body></html>
