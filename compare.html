<!DOCTYPE html><html lang="en"><head>
<title>Compare Aircraft — AeroAdi Labs</title>
<meta name="description" content="Put any two or three aircraft head-to-head — speed, range, size, and weight, visualized.">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'><path d='M2 20 L14 20 L21 13' fill='none' stroke='%233E8BFF' stroke-width='2.4' stroke-linecap='round'/><path d='M21 13 L24 10 L23.2 14.2 Z' fill='%233E8BFF'/></svg>">

</head><body>
<div id="shell-nav"></div>
<main id="main">
<section class="page-hero"><div class="wrap">
  <span class="eyebrow">Head to head</span>
  <h1 class="display-l" style="margin-top:10px">Compare</h1>
  <p class="muted" style="max-width:560px;margin-top:10px">Pick two or three aircraft. Bars are scaled to the leader in each spec; the blue bar leads.</p>
</div></section>
<section class="section"><div class="wrap">
  <div class="filter-rail" id="pickers"></div>
  <div id="result"></div>
</div></section>
</main>
<div id="shell-footer"></div>
<script src="assets/data.js"></script><script src="assets/app.js"></script>
<script>
renderShell("compare.html");
const COLORS=["var(--accent)","var(--positive)","var(--caution)"];
const METRICS=[["cruise","Cruise speed","km/h"],["range","Range","km"],["span","Wingspan","m"],["len","Length","m"],["ceil","Service ceiling","m"],["mtow","Max takeoff weight","kg"],["pax","Passengers (typical)",""]];

const tray = store.get("compareTray",[]);
let sel=[param("a"), param("b"), param("c")].filter(Boolean);
if(!sel.length && tray.length) sel=tray.slice(0,3);
if(!sel.length) sel=["boeing-747-8","airbus-a380"];
while(sel.length<3) sel.push("");

function pickers(){
  document.getElementById("pickers").innerHTML = [0,1,2].map(k=>`
    <select class="input" data-k="${k}" aria-label="Aircraft ${k+1}">
      <option value="">${k<2? "Choose aircraft…":"(optional third)"}</option>
      ${AIRCRAFT.map(a=>`<option value="${a.slug}" ${sel[k]===a.slug?"selected":""}>${a.name}</option>`).join("")}
    </select>`).join("");
  document.querySelectorAll("#pickers select").forEach(s=>s.addEventListener("change",()=>{
    sel[+s.dataset.k]=s.value; draw();
    const u=new URL(location); ["a","b","c"].forEach((p,i)=> sel[i]? u.searchParams.set(p,sel[i]) : u.searchParams.delete(p)); history.replaceState(null,"",u);
  }));
}
function draw(){
  const list = sel.filter(Boolean).map(s=>byslug(AIRCRAFT,s)).filter(Boolean);
  const R=document.getElementById("result");
  if(list.length<2){ R.innerHTML='<div class="empty">Choose at least two aircraft to compare.</div>'; return; }
  const legend = list.map((a,i)=>`<span class="tag"><span class="status-dot" style="background:${COLORS[i]}"></span>${esc(a.name)}</span>`).join(" ");
  const maxLen=Math.max(...list.map(a=>a.len));
  const sils=list.map((a,i)=>`<div style="color:${COLORS[i]};opacity:.9;margin-bottom:-14px">${silhouette(a, 30+60*(a.len/maxLen))}</div>`).join("");
  const rows=METRICS.map(m=>{
    const vals=list.map(a=>a[m[0]]||0); const max=Math.max(...vals);
    if(!max) return "";
    return `<div class="bar-row"><div class="br-label"><span>${m[1]}</span><span class="data-s">${m[2]}</span></div>
      ${list.map((a,i)=>{const v=a[m[0]]||0; return `<div class="bar ${v===max?"lead":""}"><div class="fill" style="width:${Math.max(4,100*v/max)}%;background:${v===max?COLORS[i]:"color-mix(in srgb,"+COLORS[i]+" 45%,var(--canvas-2))"}"></div><span class="bl">${esc(a.name.split(" ").slice(-1)[0])} · ${fmt(v)}</span></div>`;}).join("")}
    </div>`;}).join("");
  // verdict
  const wins=list.map(()=>0);
  METRICS.forEach(m=>{const vals=list.map(a=>a[m[0]]||0);const mx=Math.max(...vals); if(mx) wins[vals.indexOf(mx)]++;});
  const champ=list[wins.indexOf(Math.max(...wins))];
  const fastest=list.reduce((p,c)=>c.cruise>p.cruise?c:p);
  const longest=list.reduce((p,c)=>c.range>p.range?c:p);
  R.innerHTML = `
    <div class="chip-row" style="margin-bottom:20px">${legend}</div>
    <div class="card" style="margin-bottom:28px;padding:28px">
      <span class="eyebrow">Size at a glance · scaled by length</span>
      <div style="margin-top:16px">${sils}</div>
    </div>
    <div class="card" style="padding:28px">${rows}</div>
    <div class="notice" style="margin-top:20px"><b>${esc(champ.name)}</b> leads in the most categories here. <b>${esc(fastest.name)}</b> is the fastest of the group; <b>${esc(longest.name)}</b> flies farthest. Remember these aircraft were built for different jobs — a comparison shows character, not a winner.</div>`;
}
pickers(); draw();
</script></body></html>
