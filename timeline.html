<!DOCTYPE html><html lang="en"><head>
<title>Timeline — AeroAdi Labs</title>
<meta name="description" content="From Kitty Hawk to sustainable flight — the milestones that made modern aviation.">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'><path d='M2 20 L14 20 L21 13' fill='none' stroke='%233E8BFF' stroke-width='2.4' stroke-linecap='round'/><path d='M21 13 L24 10 L23.2 14.2 Z' fill='%233E8BFF'/></svg>">
</head><body>
<div id="shell-nav"></div>
<main id="main">
<section class="page-hero"><div class="wrap">
  <span class="eyebrow">History</span>
  <h1 class="display-l" style="margin-top:10px">Timeline of Flight</h1>
  <p class="muted" style="max-width:560px;margin-top:10px">From 12 seconds over a beach to a permanent global system. These are the moments that mattered.</p>
</div></section>
<section class="section"><div class="wrap" style="max-width:820px" id="tl"></div></section>
</main>
<div id="shell-footer"></div>
<script src="assets/data.js"></script><script src="assets/app.js"></script>
<script>
renderShell("timeline.html");
let html="", lastEra="";
TIMELINE.forEach(t=>{
  if(t.era!==lastEra){ if(lastEra) html+="</div>"; html+=`<div class="era-chip">${t.era}</div><div class="tl">`; lastEra=t.era; }
  html+=`<div class="tl-item"><div class="tl-date">${t.y}</div>
    <div class="title-s" style="margin:2px 0 4px">${t.title}</div>
    <p class="body-s">${t.d}${t.link? ` <a href="aircraft-detail.html?id=${t.link}">View aircraft →</a>`:""}</p></div>`;
});
html+="</div>";
document.getElementById("tl").innerHTML=html;
</script></body></html>
