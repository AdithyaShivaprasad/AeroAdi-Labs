<!DOCTYPE html><html lang="en"><head>
<title>Your Flight Log — AeroAdi Labs</title>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'><path d='M2 20 L14 20 L21 13' fill='none' stroke='%233E8BFF' stroke-width='2.4' stroke-linecap='round'/><path d='M21 13 L24 10 L23.2 14.2 Z' fill='%233E8BFF'/></svg>">

</head><body>
<div id="shell-nav"></div>
<main id="main">
<section class="page-hero"><div class="wrap">
  <span class="eyebrow">Progress</span>
  <h1 class="display-l" style="margin-top:10px">Your flight log</h1>
  <p class="muted" style="max-width:600px;margin-top:10px">Progress is stored privately in this browser — nothing is uploaded anywhere. Clearing browser data resets it.</p>
</div></section>
<section class="section"><div class="wrap" id="page"></div></section>
</main>
<div id="shell-footer"></div>
<script src="assets/data.js"></script><script src="assets/app.js"></script>
<script>
renderShell("profile.html");
const r=rank(), st=store.get("streak",{count:0}), done=store.get("lessonsDone",[]);
const hist=store.get("quizHistory",[]).slice(-8).reverse();
const saved=store.get("savedFacts",[]);
const RANKS=[["Student Pilot",0],["Private Pilot",150],["Commercial Pilot",400],["Airline Captain",900],["Test Pilot",1800]];
const nextR=RANKS.find(x=>x[1]>r.xp);
document.getElementById("page").innerHTML = `
<div class="grid g-4" style="margin-bottom:40px">
  <div class="card"><span class="data-s">RANK</span><div class="data-l" style="margin-top:6px">${r.name}</div>
    ${nextR? `<div class="progress-bar" style="margin-top:12px"><div class="pf" style="width:${Math.round(100*r.xp/nextR[1])}%"></div></div><div class="data-s" style="margin-top:6px">${nextR[1]-r.xp} XP TO ${nextR[0].toUpperCase()}</div>`:`<div class="data-s" style="margin-top:10px">TOP RANK REACHED</div>`}</div>
  <div class="card"><span class="data-s">TOTAL XP</span><div class="data-l" style="margin-top:6px">${r.xp}</div></div>
  <div class="card"><span class="data-s">STREAK</span><div class="data-l" style="margin-top:6px">${st.count} day${st.count===1?"":"s"}</div></div>
  <div class="card"><span class="data-s">WAYPOINTS REACHED</span><div class="data-l" style="margin-top:6px">${done.length}/${LESSONS.length}</div></div>
</div>

<h2 class="title-m" style="margin-bottom:16px">Lessons</h2>
<div class="grid g-3" style="margin-bottom:40px">
${LESSONS.map(L=>`<a class="card hoverable" href="lesson.html?id=${L.slug}">
  <span class="wp-code" style="font-family:var(--f-data);font-size:12px;color:${done.includes(L.slug)? "var(--positive)":"var(--accent)"};letter-spacing:.1em">${done.includes(L.slug)?"✓ ":""}${L.wp}</span>
  <div class="title-s" style="margin-top:4px">${L.title}</div></a>`).join("")}
</div>

<h2 class="title-m" style="margin-bottom:16px">Recent quiz debriefs</h2>
${hist.length? `<div class="card" style="padding:8px 20px;margin-bottom:40px">${hist.map(h=>{
  const q=QUIZZES.find(x=>x.slug===h.q);
  return `<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line-subtle)">
    <span>${q? q.title:h.q}</span><span class="data-m">${h.score}/${h.total}</span></div>`;}).join("")}</div>`
 : '<div class="empty" style="margin-bottom:40px">No quizzes flown yet. <a href="quizzes.html">Take your first →</a></div>'}

<h2 class="title-m" style="margin-bottom:16px">Saved facts</h2>
${saved.length? `<div class="grid g-3" style="margin-bottom:40px">${saved.map(i=>`<div class="card"><span class="eyebrow">SAVED</span><p class="body-s" style="margin-top:8px">${FACTS[i]}</p></div>`).join("")}</div>`
 : '<div class="empty" style="margin-bottom:40px">Save the daily fact from the homepage to collect it here.</div>'}

<button class="btn btn-secondary" onclick="if(confirm('Reset all progress? This cannot be undone.')){Object.keys(localStorage).filter(k=>k.startsWith('aeroadi:')&&k!=='aeroadi:theme').forEach(k=>localStorage.removeItem(k));location.reload();}">Reset progress</button>`;
</script></body></html>
