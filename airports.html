<!DOCTYPE html><html lang="en"><head>
<title>Airports — AeroAdi Labs</title>
<meta name="description" content="Profiles of the world's great airports — codes, runways, and the stories behind them.">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'><path d='M2 20 L14 20 L21 13' fill='none' stroke='%233E8BFF' stroke-width='2.4' stroke-linecap='round'/><path d='M21 13 L24 10 L23.2 14.2 Z' fill='%233E8BFF'/></svg>">
</head><body>
<div id="shell-nav"></div>
<main id="main">
<section class="page-hero"><div class="wrap">
  <span class="eyebrow">Database</span>
  <h1 class="display-l" style="margin-top:10px">Airports</h1>
  <p class="muted" style="max-width:560px;margin-top:10px">The busiest, cleverest, and most interesting airports on Earth — and why each one works the way it does.</p>
</div></section>
<section class="section"><div class="wrap"><div class="grid g-3" id="apGrid"></div></div></section>
</main>
<div id="shell-footer"></div>
<script src="assets/data.js"></script><script src="assets/app.js"></script>
<script>
renderShell("airports.html");
document.getElementById("apGrid").innerHTML = AIRPORTS.map(p=>`
  <a class="card hoverable" href="airport-detail.html?id=${p.icao}">
    <span class="eyebrow">${p.flag} ${esc(p.country)}</span>
    <div class="title-s" style="margin:8px 0 2px">${esc(p.name)}</div>
    <div class="body-s">${esc(p.city)}</div>
    <div class="stat-row">
      <span class="st"><span class="data-s">IATA</span><span class="data-m">${p.iata}</span></span>
      <span class="st"><span class="data-s">ICAO</span><span class="data-m">${p.icao}</span></span>
      <span class="st"><span class="data-s">PAX/YR</span><span class="data-m">${p.pax}</span></span>
      <span class="st"><span class="data-s">RUNWAYS</span><span class="data-m">${p.rwys}</span></span>
    </div></a>`).join("");
</script></body></html>
