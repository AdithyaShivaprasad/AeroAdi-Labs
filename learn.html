<!DOCTYPE html><html lang="en"><head>
<title>Learn — AeroAdi Labs</title>
<meta name="description" content="A structured curriculum on how flight works — interactive lessons on lift, drag, jet engines, and more.">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'><path d='M2 20 L14 20 L21 13' fill='none' stroke='%233E8BFF' stroke-width='2.4' stroke-linecap='round'/><path d='M21 13 L24 10 L23.2 14.2 Z' fill='%233E8BFF'/></svg>">
</head><body>
<div id="shell-nav"></div>
<main id="main">
<section class="page-hero"><div class="wrap">
  <span class="eyebrow">Curriculum</span>
  <h1 class="display-l" style="margin-top:10px">Learn</h1>
  <p class="muted" style="max-width:560px;margin-top:10px">Lessons are waypoints on a flight plan. Complete one to move to the next — each takes about ten minutes and ends with a knowledge check.</p>
</div></section>
<section class="section"><div class="wrap" id="paths"></div></section>
</main>
<div id="shell-footer"></div>
<script src="assets/data.js"></script><script src="assets/app.js"></script>
<script>
renderShell("learn.html");
const done = store.get("lessonsDone",[]);
document.getElementById("paths").innerHTML = PATHS.map(p=>{
  const doneCount=p.lessons.filter(l=>done.includes(l)).length;
  return `<div class="card" style="padding:32px">
    <div class="section-head" style="margin-bottom:20px">
      <div><span class="eyebrow">Learning path</span><h2 class="title-m" style="margin-top:6px">${p.title}</h2></div>
      <span class="data-s">${doneCount}/${p.lessons.length} WAYPOINTS</span>
    </div>
    <div class="wp-track">${p.lessons.map((ls,i)=>{
      const L=byslug(LESSONS,ls); const d=done.includes(ls);
      return `<div class="wp-item ${d?"done":""}">
        <span class="wp-node">${d?"✓":i+1}</span>
        <a href="lesson.html?id=${L.slug}" style="color:var(--ink-1)">
          <span class="wp-code">${L.wp}</span>
          <div class="title-s" style="margin:2px 0">${L.title}</div>
          <span class="body-s">${L.mins} min · <span class="pips">${pips(L.diff)}</span> ${DIFF_NAMES[L.diff]}${L.interactive? " · interactive":""}</span>
        </a></div>`;}).join("")}
    </div></div>`;
}).join("");
</script></body></html>
